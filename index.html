<!-- Модальное окно результата -->
<div id="modal" class="modal">
  <div class="modal-card card w-full max-w-sm rounded-3xl p-7 text-center">
    <div id="m-icon" class="w-24 h-24 mx-auto rounded-full flex items-center justify-center text-5xl mb-4"></div>
    <h2 id="m-title" class="font-extrabold text-3xl"></h2>
    <div id="m-time" class="timer-num font-grotesk text-6xl font-bold my-4">00.00</div>
    <p id="m-text" class="text-zinc-400 text-sm mb-6"></p>
    <button id="btn-again" class="gold-btn w-full rounded-2xl py-4 font-bold text-lg flex items-center justify-center gap-2">
      <i class="fa-solid fa-rotate-right"></i> Играть снова
    </button>
  </div>

<script>
(() => {
  const PAY_URL = 'https://pay.cloudtips.ru/p/0f8c6211';
  const WIN_CHANCE = 0.40, WIN_MIN = 9.90, WIN_MAX = 10.05, TENSE_MIN = 8.50, TENSE_MAX = 10.10, TIME_LIMIT = 15;

  const tg = window.Telegram && Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#0D0D0E'); tg.setBackgroundColor('#0D0D0E'); tg.disableVerticalSwipes(); } catch (e) {}
  }
  const $ = id => document.getElementById(id);
  const haptic = {
    impact: s => { try { tg && tg.HapticFeedback.impactOccurred(s); } catch (e) {} },
    notify: t => { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} },
    select: () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  };

  // Запрет зума и выделения
  ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault()));
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now(); if (now - lastTouch < 300) e.preventDefault(); lastTouch = now;
  }, { passive: false });

  // ---------- Web Audio ----------
  let ctx = null;
  const audio = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, start, dur, type = 'sine', vol = 0.15, slideTo) {
    const c = audio(); if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    click: () => tone(720, 0, 0.07, 'triangle', 0.12),
    start: () => { tone(440, 0, 0.1, 'triangle'); tone(660, 0.09, 0.14, 'triangle'); },
    stop: () => tone(300, 0, 0.14, 'square', 0.1, 180),
    win: () => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.08, 1.1, 'sine', 0.14));
                 tone(261.63, 0, 1.2, 'triangle', 0.1); },
    lose: () => { tone(330, 0, 0.25, 'sawtooth', 0.09, 220); tone(220, 0.22, 0.45, 'sawtooth', 0.09, 110); }
  };

  // ---------- Экраны ----------
  const show = id => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  };

  $('btn-pay').addEventListener('click', () => {
    sfx.click(); haptic.impact('light');
    if (tg && tg.openLink) tg.openLink(PAY_URL); else window.open(PAY_URL, '_blank');
  });
  $('btn-paid').addEventListener('click', () => {
    sfx.click(); haptic.notify('success'); resetGame(); show('screen-game');
  });

  // ---------- Игра ----------
  const timerEl = $('timer'), box = $('timer-box'), hint = $('hint'), btn = $('btn-action');
  let running = false, startTs = 0, raf = 0, lastBuzz = 0, inZone = false;

  const fmt = t => {
    const v = Math.min(t, 99.99);
    return (v < 10 ? '0' : '') + v.toFixed(2);
  };
  function setBtn(state) {
    if (state === 'stop') {
      btn.className = 'red-btn w-full rounded-2xl py-5 font-extrabold text-2xl mt-auto flex items-center justify-center gap-3';
      btn.innerHTML = '<i class="fa-solid fa-hand"></i> <span>Стоп!</span>';
    } else {
      btn.className = 'gold-btn w-full rounded-2xl py-5 font-extrabold text-2xl mt-auto flex items-center justify-center gap-3';
      btn.innerHTML = '<i class="fa-solid fa-play"></i> <span>Старт</span>';
    }
  }
  function resetGame() {
    cancelAnimationFrame(raf); running = false; inZone = false;
    timerEl.textContent = '00.00';
    box.classList.remove('running', 'zone', 'win');
    hint.textContent = 'Нажми «Старт» и лови 10.00';
    setBtn('start');
  }
  function tick(now) {
    if (!running) return;
    const t = (now - startTs) / 1000;
    timerEl.textContent = fmt(t);
    const z = t >= TENSE_MIN && t <= TENSE_MAX;
    if (z !== inZone) {
      inZone = z; box.classList.toggle('zone', z);
      hint.textContent = z ? 'Сейчас!' : 'Лови 10.00';
    }
    if (z && now - lastBuzz > 90) { lastBuzz = now; haptic.impact('medium'); }
    if (t >= TIME_LIMIT) return finish(TIME_LIMIT);
    raf = requestAnimationFrame(tick);
  }
  function start() {
    running = true; startTs = performance.now(); lastBuzz = 0;
    box.classList.add('running'); hint.textContent = 'Лови 10.00';
    setBtn('stop'); sfx.start(); haptic.impact('heavy');
    raf = requestAnimationFrame(tick);
  }
  function finish(t) {
    if (!running) return;
    running = false; cancelAnimationFrame(raf);
    box.classList.remove('zone', 'running');
    sfx.stop(); haptic.impact('rigid');
    let shown = Math.floor(t * 100) / 100, win = false;
    if (shown >= WIN_MIN && shown <= WIN_MAX) win = Math.random() < WIN_CHANCE;
    if (win) shown = 10.00;
    timerEl.textContent = fmt(shown);
    if (win) box.classList.add('win');
    setTimeout(() => showResult(win, shown), 550);
  }
  btn.addEventListener('click', () => {
    if (!running && btn.textContent.trim() === 'Старт') start();
    else if (running) finish((performance.now() - startTs) / 1000);
  });

  // ---------- Результат ----------
  function showResult(win, t) {
    const icon = $('m-icon'), time = $('m-time');
    time.textContent = fmt(t);
    if (win) {
      icon.className = 'w-24 h-24 mx-auto rounded-full flex items-center justify-center text-5xl mb-4 bg-gold/15 text-gold border border-gold/40';
      icon.innerHTML = '<i class="fa-solid fa-trophy"></i>';
      $('m-title').textContent = 'Победа!';
      $('m-title').className = 'font-extrabold text-3xl gold-text';
      time.style.color = '#7CFFB2';
      $('m-text').textContent = 'Ровно 10.00! Покажите этот экран бариста, чтобы получить приз.';
      sfx.win(); haptic.notify('success'); confettiShow();
    } else {
      icon.className = 'w-24 h-24 mx-auto rounded-full flex items-center justify-center text-5xl mb-4 bg-red-500/10 text-red-400 border border-red-500/40';
      icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      $('m-title').textContent = 'Не вышло:(';
      $('m-title').className = 'font-extrabold text-3xl text-red-400';
      time.style.color = '#FF8A8A';
      $('m-text').textContent = 'Почти! Попробуйте ещё раз — десятая секунда близко!';
      sfx.lose(); haptic.notify('error');
    }
    $('modal').classList.add('show');
  }
  function confettiShow() {
    if (typeof confetti !== 'function') return;
    const colors = ['#D4AF37', '#F3D98B', '#FFFFFF', '#B08D22'];
    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors });
    setTimeout(() => confetti({ particleCount: 70, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors }), 250);
    setTimeout(() => confetti({ particleCount: 70, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors }), 400);
  }
  $('btn-again').addEventListener('click', () => {
    sfx.click(); haptic.select();
    $('modal').classList.remove('show');
    resetGame(); show('screen-pay');
  });
})();
</script>
</body>
</html>
